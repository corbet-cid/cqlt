schema = 1
project = "cqlt"

[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]
all_targets = true
toolchain = "system"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["rust", "verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
