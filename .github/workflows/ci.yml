name: Quality library
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Stage the verified Vale release for the backend contract test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vale"
          curl --fail --location --silent --show-error \
            https://github.com/vale-cli/vale/releases/download/v3.23.0/vale_3.23.0_Linux_64-bit.tar.gz \
            -o "$RUNNER_TEMP/vale.tar.gz"
          echo "cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - run: cargo test --locked --test vale -- --ignored
